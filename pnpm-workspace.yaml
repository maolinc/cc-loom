packages:
  - 'packages/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
overrides:
  'fast-uri@>=3.0.0 <4.0.0': 3.1.4
auditConfig:
  ignoreGhsas:
    # GHSA-qwww-vcr4-c8h2 only affects React Router RSC actions. Loom is a
    # client-only Vite SPA, and the advisory's patched 8.3.0 is not published.
    - GHSA-qwww-vcr4-c8h2
minimumReleaseAgeExclude:
  - '@fastify/rate-limit@11.2.0'
